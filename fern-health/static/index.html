<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fern Health</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f7f2;
      color: #2d3a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #3a6b4a;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    header .logo { font-size: 22px; }
    header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.3px; }
    header .subtitle { font-size: 13px; opacity: 0.8; margin-top: 2px; }

    .topic-pills {
      background: #eef3ec;
      padding: 10px 24px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #d5e0d2;
    }

    .pill {
      background: white;
      border: 1.5px solid #3a6b4a;
      color: #3a6b4a;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill:hover { background: #3a6b4a; color: white; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 15px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .message.user {
      background: #3a6b4a;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: white;
      border: 1px solid #dde8da;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.assistant .sources {
      margin-top: 8px;
      font-size: 12px;
      color: #6b8f71;
    }

    .message.thinking {
      background: white;
      border: 1px solid #dde8da;
      align-self: flex-start;
      color: #8aab8e;
      font-style: italic;
    }

    .message p { margin-bottom: 8px; }
    .message p:last-child { margin-bottom: 0; }
    .message ul, .message ol { padding-left: 18px; margin: 6px 0; }
    .message li { margin-bottom: 4px; }
    .message strong { color: #2a4f32; }

    #input-area {
      background: white;
      border-top: 1px solid #dde8da;
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      border: 1.5px solid #c5d9c2;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 44px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    #user-input:focus { border-color: #3a6b4a; }

    #send-btn {
      background: #3a6b4a;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    #send-btn:hover:not(:disabled) { background: #2f5a3d; }
    #send-btn:disabled { background: #9ab8a0; cursor: not-allowed; }

    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: #5a7a5e;
    }
    .welcome h2 { font-size: 22px; margin-bottom: 10px; color: #3a6b4a; }
    .welcome p { font-size: 15px; max-width: 480px; margin: 0 auto 24px; line-height: 1.6; }

    .suggestion-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
    }

    .suggestion {
      background: white;
      border: 1.5px solid #d5e0d2;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      color: #3a6b4a;
      transition: all 0.2s;
      line-height: 1.4;
    }
    .suggestion:hover { border-color: #3a6b4a; background: #eef3ec; }
  </style>
</head>
<body>

<header>
  <div class="logo">🌿</div>
  <div>
    <h1>Fern Health</h1>
    <div class="subtitle">PCOS & Endometriosis Assistant</div>
  </div>
</header>

<div class="topic-pills">
  <button class="pill" onclick="askTopic('What are the main symptoms of PCOS?')">PCOS Symptoms</button>
  <button class="pill" onclick="askTopic('What treatments are available for endometriosis?')">Endo Treatments</button>
  <button class="pill" onclick="askTopic('What diet helps with PCOS?')">PCOS Diet</button>
  <button class="pill" onclick="askTopic('How is endometriosis diagnosed?')">Endo Diagnosis</button>
</div>

<div id="chat-container">
  <div class="welcome" id="welcome">
    <h2>Hello, I'm Fern 🌿</h2>
    <p>I'm here to help you understand PCOS and Endometriosis — symptoms, treatments, lifestyle support, and more. Ask me anything.</p>
    <div class="suggestion-grid">
      <button class="suggestion" onclick="askTopic('What is the difference between PCOS and endometriosis?')">What's the difference between PCOS and endometriosis?</button>
      <button class="suggestion" onclick="askTopic('What supplements help with PCOS?')">What supplements help with PCOS?</button>
      <button class="suggestion" onclick="askTopic('How painful is endometriosis and how can I manage the pain?')">How can I manage endometriosis pain?</button>
      <button class="suggestion" onclick="askTopic('Can PCOS affect fertility?')">Can PCOS affect my fertility?</button>
    </div>
  </div>
</div>

<div id="input-area">
  <textarea id="user-input" placeholder="Ask about PCOS, endometriosis, symptoms, treatments..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  let history = [];

  userInput.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  userInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function askTopic(question) {
    userInput.value = question;
    sendMessage();
  }

  function removeWelcome() {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();
  }

  function appendMessage(role, text, sources) {
    removeWelcome();
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = formatText(text);
    if (sources && sources.length > 0) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.textContent = '📚 Sources: ' + sources.join(', ');
      div.appendChild(s);
    }
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
  }

  function formatText(text) {
    // Convert markdown-ish to HTML
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/^### (.+)$/gm, '<strong>$1</strong>')
      .replace(/^## (.+)$/gm, '<strong>$1</strong>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
      .split('\n\n').map(p => p.trim() ? `<p>${p}</p>` : '').join('');
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;

    appendMessage('user', text);

    const thinking = document.createElement('div');
    thinking.className = 'message thinking';
    thinking.textContent = 'Fern is thinking...';
    chatContainer.appendChild(thinking);
    chatContainer.scrollTop = chatContainer.scrollHeight;

    try {
      const res = await fetch('/api/agent3/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history }),
      });

      const data = await res.json();
      chatContainer.removeChild(thinking);

      if (!res.ok) {
        appendMessage('assistant', 'Sorry, something went wrong. Please try again.');
      } else {
        appendMessage('assistant', data.response, data.sources);
        history.push({ role: 'user', content: text });
        history.push({ role: 'assistant', content: data.response });
        // Keep last 10 turns to avoid token bloat
        if (history.length > 20) history = history.slice(-20);
      }
    } catch (err) {
      chatContainer.removeChild(thinking);
      appendMessage('assistant', 'Network error. Please check your connection and try again.');
    }

    sendBtn.disabled = false;
    userInput.focus();
  }
</script>
</body>
</html>
