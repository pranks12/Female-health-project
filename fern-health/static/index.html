<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fern Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sage:       #5C8A6B;
      --sage-light: #EAF2EC;
      --sage-mid:   #A8C8B2;
      --rose-light: #FAEDEF;
      --text:       #2D3A35;
      --text-muted: #6B7F76;
      --border:     #D6E6DA;
      --white:      #FFFFFF;
      --bg:         #F5F8F5;
      --radius:     16px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--sage);
    }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ccc;
      transition: background .3s;
    }
    .dot.on  { background: #5CB85C; }
    .dot.off { background: #D9534F; }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    aside {
      width: 240px;
      background: var(--white);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 20px;
      flex-shrink: 0;
    }
    .new-chat {
      display: flex; align-items: center; gap: 8px;
      width: 100%;
      background: var(--sage); color: var(--white);
      border: none; border-radius: 10px;
      padding: 10px 14px;
      font-size: .88rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .new-chat:hover { background: #4a7558; }
    .section-label {
      font-size: .7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted); margin-bottom: 8px;
    }
    .topic {
      display: block; width: 100%; text-align: left;
      background: none; border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 12px;
      font-size: .84rem; color: var(--text);
      cursor: pointer; margin-bottom: 6px;
      transition: background .15s, border-color .15s;
    }
    .topic:hover {
      background: var(--sage-light);
      border-color: var(--sage-mid);
      color: var(--sage);
    }
    .disclaimer {
      margin-top: auto;
      font-size: .72rem; color: var(--text-muted); line-height: 1.5;
      background: var(--rose-light); border-radius: 10px; padding: 10px 12px;
    }

    /* ── Chat ── */
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .messages {
      flex: 1; overflow-y: auto;
      padding: 24px 28px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Welcome */
    .welcome {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      flex: 1; gap: 16px; text-align: center;
      color: var(--text-muted); padding: 40px;
    }
    .fern-icon {
      width: 72px; height: 72px;
      background: var(--sage-light); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .welcome h2 { font-size: 1.4rem; color: var(--text); }
    .welcome p  { font-size: .9rem; max-width: 380px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .chip {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 20px; padding: 7px 16px;
      font-size: .82rem; cursor: pointer;
      color: var(--sage); font-weight: 500;
      transition: background .15s, border-color .15s;
    }
    .chip:hover { background: var(--sage-light); border-color: var(--sage-mid); }

    /* Bubbles */
    .msg { display: flex; gap: 12px; max-width: 740px; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      flex-shrink: 0; display: flex;
      align-items: center; justify-content: center;
      font-size: .8rem; font-weight: 700;
    }
    .avatar.ai   { background: var(--sage-light); color: var(--sage); }
    .avatar.user { background: var(--sage); color: var(--white); }
    .bubble {
      padding: 12px 16px; border-radius: var(--radius);
      font-size: .92rem; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.ai   .bubble { background: var(--white); border: 1px solid var(--border); border-top-left-radius: 4px; }
    .msg.user .bubble { background: var(--sage-light); border: 1px solid var(--sage-mid); border-top-right-radius: 4px; }

    /* Typing dots */
    .dots { display: flex; gap: 5px; padding: 4px 0; align-items: center; }
    .dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--sage-mid); animation: bop 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .2s; }
    .dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bop {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-6px); }
    }

    /* ── Input ── */
    .input-bar {
      padding: 16px 28px 20px;
      background: var(--white);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-wrap {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px;
      transition: border-color .2s;
    }
    .input-wrap:focus-within { border-color: var(--sage); }
    textarea {
      flex: 1; border: none; background: transparent; resize: none;
      font-family: var(--font); font-size: .93rem; color: var(--text);
      line-height: 1.5; max-height: 140px; outline: none;
    }
    textarea::placeholder { color: var(--text-muted); }
    .send {
      width: 36px; height: 36px; border-radius: 10px;
      border: none; background: var(--sage); color: var(--white);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s, opacity .15s;
    }
    .send:disabled { opacity: .4; cursor: not-allowed; }
    .send:not(:disabled):hover { background: #4a7558; }
    .hint { font-size: .72rem; color: var(--text-muted); margin-top: 6px; text-align: center; }

    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <circle cx="14" cy="14" r="14" fill="#EAF2EC"/>
      <path d="M14 24C14 24 6 18 6 11C6 7.134 9.582 4 14 4C18.418 4 22 7.134 22 11C22 18 14 24 14 24Z" fill="#5C8A6B"/>
      <path d="M14 24C14 24 14 14 14 9" stroke="#3d6b4f" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M14 13C14 13 11 11 10 8" stroke="#3d6b4f" stroke-width="1" stroke-linecap="round"/>
      <path d="M14 17C14 17 17 15 18.5 12" stroke="#3d6b4f" stroke-width="1" stroke-linecap="round"/>
    </svg>
    Fern Health
  </div>
  <div class="status-pill">
    <div class="dot" id="dot"></div>
    <span id="statusTxt">Connecting…</span>
  </div>
</header>

<div class="layout">
  <aside>
    <button class="new-chat" onclick="newChat()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      New chat
    </button>

    <div>
      <div class="section-label">Topics</div>
      <button class="topic" onclick="suggest('Tell me about managing period pain naturally')">🌿 Period health</button>
      <button class="topic" onclick="suggest('What are common signs of hormonal imbalance?')">⚖️ Hormones</button>
      <button class="topic" onclick="suggest('How can I support my fertility naturally?')">🌸 Fertility</button>
      <button class="topic" onclick="suggest('What should I know about perimenopause?')">🍂 Menopause</button>
      <button class="topic" onclick="suggest('What nutrition tips support women\'s health?')">🥗 Nutrition</button>
      <button class="topic" onclick="suggest('How does stress affect my menstrual cycle?')">🧘 Stress &amp; cycle</button>
    </div>

    <div class="disclaimer">
      <strong>Note:</strong> Fern provides general wellness guidance only. Always consult a qualified healthcare provider for medical advice.
    </div>
  </aside>

  <main>
    <div class="messages" id="msgs"></div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="inp" rows="1" placeholder="Ask Fern anything about your health…"
          onkeydown="onKey(event)" oninput="resize(this)"></textarea>
        <button class="send" id="sendBtn" onclick="send()" title="Send">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M14 8L2 2l3 6-3 6 12-6z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="hint">Enter to send &middot; Shift+Enter for new line</div>
    </div>
  </main>
</div>

<script>
  const WELCOME_HTML = `
    <div class="welcome" id="welcome">
      <div class="fern-icon">
        <svg width="36" height="36" viewBox="0 0 28 28" fill="none">
          <path d="M14 26C14 26 5 19 5 11C5 6.582 9.03 3 14 3C18.97 3 23 6.582 23 11C23 19 14 26 14 26Z" fill="#5C8A6B"/>
          <path d="M14 26C14 26 14 14 14 8" stroke="#3d6b4f" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M14 14C14 14 10 12 9 8" stroke="#3d6b4f" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M14 18C14 18 18 15 20 11" stroke="#3d6b4f" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <h2>Hello, I'm Fern</h2>
      <p>Your compassionate women's health companion. Ask me anything about your cycle, hormones, fertility, menopause, or general wellbeing.</p>
      <div class="chips">
        <button class="chip" onclick="suggest('How can I track my menstrual cycle?')">Track my cycle</button>
        <button class="chip" onclick="suggest('Why am I so tired before my period?')">Period fatigue</button>
        <button class="chip" onclick="suggest('What foods help with PMS?')">PMS nutrition</button>
        <button class="chip" onclick="suggest('How do I know if my cycle is normal?')">Is my cycle normal?</button>
      </div>
    </div>`;

  let history = [];
  let busy = false;

  const msgs    = document.getElementById('msgs');
  const inp     = document.getElementById('inp');
  const sendBtn = document.getElementById('sendBtn');

  // Render welcome on load
  msgs.innerHTML = WELCOME_HTML;

  // Health check
  fetch('/api/health').then(r => {
    const dot = document.getElementById('dot');
    const txt = document.getElementById('statusTxt');
    if (r.ok) { dot.className = 'dot on'; txt.textContent = 'Fern is ready'; }
    else       { dot.className = 'dot off'; txt.textContent = 'Offline'; }
  }).catch(() => {
    document.getElementById('dot').className = 'dot off';
    document.getElementById('statusTxt').textContent = 'Offline';
  });

  function newChat() {
    history = [];
    msgs.innerHTML = WELCOME_HTML;
  }

  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function suggest(text) { inp.value = text; send(); }

  async function send() {
    const text = inp.value.trim();
    if (!text || busy) return;

    document.getElementById('welcome')?.remove();

    busy = true;
    sendBtn.disabled = true;
    inp.value = '';
    inp.style.height = 'auto';

    history.push({ role: 'user', content: text });
    addBubble('user', text);

    const tid = addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      document.getElementById(tid)?.remove();
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const wrap   = addBubble('ai', '');
      const bubble = wrap.querySelector('.bubble');
      let full = '';

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if (raw === '[DONE]') break;
          try {
            full += JSON.parse(raw).text;
            bubble.textContent = full;
            msgs.scrollTop = msgs.scrollHeight;
          } catch {}
        }
      }

      history.push({ role: 'assistant', content: full });

    } catch (err) {
      document.getElementById(tid)?.remove();
      addBubble('ai', 'Something went wrong — please try again.');
      console.error(err);
    }

    busy = false;
    sendBtn.disabled = false;
    inp.focus();
  }

  function addBubble(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.innerHTML = `<div class="avatar ${role}">${role === 'ai' ? '🌿' : 'You'}</div><div class="bubble"></div>`;
    wrap.querySelector('.bubble').textContent = text;
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    return wrap;
  }

  function addTyping() {
    const id = 'tp' + Date.now();
    const wrap = document.createElement('div');
    wrap.className = 'msg ai'; wrap.id = id;
    wrap.innerHTML = `<div class="avatar ai">🌿</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    return id;
  }
</script>
</body>
</html>
